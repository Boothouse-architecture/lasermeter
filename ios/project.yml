name: Lasermeter
options:
  bundleIdPrefix: be.boothouse
  deploymentTarget:
    iOS: "16.0"
targets:
  Lasermeter:
    type: application
    platform: iOS
    sources:
      - path: Lasermeter
      - path: web
        type: folder
        buildPhase: resources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Lasermeter
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        NSBluetoothAlwaysUsageDescription: "Lasermeter verbindt via Bluetooth met je Bosch-afstandsmeter om metingen te ontvangen."
        NSCameraUsageDescription: "De camera en LiDAR-sensor worden gebruikt om de ruimte te scannen."
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: be.boothouse.lasermeter
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    scheme: {}
